name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  python-test:
    name: Python Tests (pytest in container)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build bot Docker image
        run: |
          docker build \
            --build-arg INSTALL_DEV=true \
            -t trader-bot:test \
            ./bot

      - name: Run pytest in bot container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/tests:/tests \
            -v ${{ github.workspace }}/bot:/app \
            trader-bot:test \
            sh -c "cd /tests && python -m pytest /tests -v --cov=bot --cov=api --cov-report=xml:/tests/coverage.xml --cov-report=term"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./tests/coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # ==========================================
  # Security: Check for secrets in code
  # ==========================================
  secrets-scan:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # Summary Job (required checks)
  # ==========================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [python-test, secrets-scan]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [ "${{ needs.python-test.result }}" != "success" ] || \
             [ "${{ needs.secrets-scan.result }}" != "success" ]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed successfully"

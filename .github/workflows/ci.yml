name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  python-test:
    name: Python Tests (pytest in container)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get file architecture
        run: ls -R

      - name: install dev dependencies
        run: pip install Bot/requirements-dev.txt

      - name: Run tests
        run: pytest /tests

  # ==========================================
  # Security: Check for secrets in code
  # ==========================================
  secrets-scan:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # Summary Job (required checks)
  # ==========================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [python-test, secrets-scan]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [ "${{ needs.python-test.result }}" != "success" ] || \
             [ "${{ needs.secrets-scan.result }}" != "success" ]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed successfully"

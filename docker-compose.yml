# ==========================================
# Development docker-compose
# Uses local bind mounts in ./volumes/ directory for most services
# PostgreSQL uses named volume (Windows compatibility)
# For production, use docker-compose.prod.yml
# ==========================================

# ==========================================
# Networks
# ==========================================
networks:
  trader-network:
    driver: bridge

# ==========================================
# Volumes
# ==========================================
volumes:
  postgres_data:  # Named volume for PostgreSQL (Windows compatibility)


services:
  # ==========================================
  # PostgreSQL + TimescaleDB
  # ==========================================
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: trader-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trader_bot}
      POSTGRES_USER: ${POSTGRES_USER:-trader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
      TIMESCALEDB_TELEMETRY: ${TIMESCALEDB_TELEMETRY:-off}
    volumes:
      # Named volume instead of bind mount (Windows compatibility)
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - trader-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trader} -d ${POSTGRES_DB:-trader_bot}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Trading Bot (Python)
  # ==========================================
  bot:
    container_name: trader-bot
    cpu_count: 3
    build:
      context: ./bot
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"  # Install dev dependencies in dev environment
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-trader}:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/${POSTGRES_DB:-trader_bot}
    volumes:
      - ./bot:/app
      - ./db:/db
      - ./tests:/tests  # Mount tests directory for running tests in container
      - ./volumes/bot_logs:/var/log/trader-bot
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - trader-network
    healthcheck:
      test: [ "CMD", "python", "-m", "main", "status" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    develop:
      watch:
        - path: ./bot
          action: sync+restart
          target: /app

  # ==========================================
  # API (FastAPI)
  # ==========================================
  api:
    container_name: trader-api
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-trader}:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/${POSTGRES_DB:-trader_bot}
      API_HOST: 0.0.0.0
      API_PORT: 8000
    volumes:
      - ./api:/app/api
    ports:
      - "8000:8000"  # Direct access in dev
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - trader-network
    develop:
      watch:
        - path: ./api
          action: sync+restart
          target: /app

  # ==========================================
  # Dashboard (Vue.js)
  # ==========================================
  dashboard:
    container_name: trader-dashboard
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      # VITE_GRAFANA_BASE_URL: Set externally if using external Grafana
    volumes:
      - ./dashboard:/app
      - /app/node_modules  # Prevent overwriting node_modules
    ports:
      - "5173:5173"  # Direct access in dev
    networks:
      - trader-network
    develop:
      watch:
        - path: ./dashboard
          action: sync
          target: /app
          ignore:
            - node_modules/

  # ==========================================
  # NOTE: Grafana has been moved to external hosting
  # ==========================================
  # Grafana is now hosted on a separate server for multi-project monitoring.
  # The PostgreSQL database remains exposed on port 5432 for external Grafana to connect.
  # Dashboard JSON files are kept in /grafana/ folder for reference/export.
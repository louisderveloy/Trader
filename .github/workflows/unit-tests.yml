name: Python-Tests

on:
  pull_request:
    branches: "*"
  workflow_dispatch:

jobs:
  python-test:
    name: Python Tests (pytest in container)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get file architecture
        run: cd ~ && pwd && ls -aR

      - uses: actions/cache@v5
        with:
          path: ~/.cache
          key: venv-${{ runner.os }}-${{ hashFiles('**/requirements*.txt') }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          pip-install: -r Bot/requirements-dev.txt

      - name: Run tests
        working-directory: Bot
        run: python -m pytest /home/runner/work/Trader/Trader/tests/ --ignore=/home/runner/work/Trader/Trader/tests/test_instance_lock.py

  secrets-scan:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
[project]
name = "trader-bot"
version = "0.1.0"
description = "Crypto trading bot for Binance with backtesting and optimization"
requires-python = ">=3.13"
dependencies = [
    # Core frameworks
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",

    # Database
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.10",

    # Redis
    "redis>=5.2.0",

    # Exchange connectors
    "python-binance>=1.0.19",  # Binance official SDK
    "ccxt>=4.4.0",   # Multi-exchange abstraction (includes Binance support)

    # Technical indicators
    "pandas>=2.2.0",
    "numpy>=2.1.0",

    # Backtesting
    "vectorbt>=0.26.0",
    "backtrader>=1.9.78.123",

    # Optimization
    "optuna>=4.1.0",

    # Notifications
    "discord-webhook>=1.3.1",

    # HTTP client
    "httpx>=0.28.0",

    # Utilities
    "python-dotenv>=1.0.1",
    "python-jose[cryptography]>=3.3.0",  # JWT
    "passlib[bcrypt]>=1.7.4",  # Password hashing
    "python-multipart>=0.0.17",  # Form data

    # Security
    "slowapi>=0.1.9",  # Rate limiting
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
]

[build-system]
requires = ["setuptools>=75.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --cov=bot --cov=api --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["bot", "api"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false

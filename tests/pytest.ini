[pytest]
# Pytest configuration for Trader Bot

# Minimum version
minversion = 8.0

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -ra
    -q
    --strict-markers
    --tb=short
    --cov=bot
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=0

# Asyncio mode
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Coverage
[coverage:run]
source = bot
omit =
    */tests/*
    */__pycache__/*
    */site-packages/*
    bot/main.py

[coverage:report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

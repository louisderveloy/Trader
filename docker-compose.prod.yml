# ==========================================
# Production docker-compose
# Uses Docker named volumes instead of local bind mounts
# Start with: docker-compose -f docker-compose.prod.yml up -d
# ==========================================

# ==========================================
# Networks
# ==========================================
networks:
  trader-network:
    driver: bridge

# ==========================================
# Volumes (Docker-managed, persistent)
# ==========================================
volumes:
  postgres_data:
  traefik_certs:
  bot_logs:
  authelia_data: # Authelia filesystem notifier (storage is now PostgreSQL)

services:
  # ==========================================
  # PostgreSQL + TimescaleDB
  # ==========================================
  postgres:
    # Pinned by digest (security review #9). MUST match the TimescaleDB version
    # the prod postgres_data volume was built with: 2.28.0 on PostgreSQL 16.
    # Postgres records the active extension version in its catalog and refuses
    # to load an OLDER shared library ($libdir/timescaledb-2.28.0). A previous
    # pin to a 2.27.2 digest DOWNGRADED prod and broke startup with
    # "could not access file $libdir/timescaledb-2.28.0". To bump: run
    # ALTER EXTENSION timescaledb UPDATE inside a newer image, then repin here.
    image: timescale/timescaledb:2.28.0-pg16@sha256:68faf0bca42125ff98228a8f5a379bcf0ac588d8156f716be8aaf9befd65857f
    container_name: trader-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TIMESCALEDB_TELEMETRY: off
    # Enable TLS so the EXTERNAL Grafana connection (over the public 5432 port)
    # is encrypted. SSL is enabled but NOT required: local containers (bot, api,
    # authelia) keep connecting over the trader-network without TLS. The Grafana
    # client enforces encryption on its side with sslmode=require (see notes below).
    command:
      - "postgres"
      - "-c"
      - "ssl=on"
      - "-c"
      - "ssl_cert_file=/etc/postgresql/certs/server.crt"
      - "-c"
      - "ssl_key_file=/etc/postgresql/certs/server.key"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # TLS material — real files are gitignored (db/certificates/*.crt|*.key).
      # On the VPS the key MUST be owned root:root with mode 600/640, or owned by
      # the container postgres user with mode 600, otherwise postgres refuses to
      # start. See the "PostgreSQL TLS setup" note at the bottom of this file.
      - /etc/trader/postgres/certificates/server.crt:/etc/postgresql/certs/server.crt
      - /etc/trader/postgres/certificates/server.key:/etc/postgresql/certs/server.key
    ports:
      # Expose on all interfaces for external Grafana connection
      # SECURITY: Configure firewall (ufw) to allow ONLY Grafana server IP
      # See docs/A6_runbook.md for firewall setup instructions
      - "5432:5432" # grafana.derveloy.eu = 89.91.163.180
    networks:
      - trader-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Traefik (Reverse Proxy)
  # ==========================================
  traefik:
    image: traefik:v3.7
    container_name: trader-traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=false" # Disable dashboard in production
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Let's Encrypt configuration
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      # Redirect HTTP to HTTPS
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/letsencrypt
    networks:
      trader-network:
        # Internal DNS aliases so containers on trader-network resolve the public
        # hostnames to Traefik itself, instead of the VPS public IP. Without this,
        # server-to-server calls to a public hostname (notably the API as an OIDC
        # relying party reaching https://auth.trader.derveloy.eu for discovery/token/
        # JWKS) leave the bridge network for the host's public IP and hang (most VPS
        # don't NAT-hairpin), surfacing as "OIDC discovery failed:" (empty connect-
        # timeout) → 503 at login. Traefik terminates TLS with the valid Let's Encrypt
        # cert for each host and routes by Host header, so issuer/URL strings stay
        # identical to the public ones.
        aliases:
          - ${DOMAIN_AUTH}
          - ${DOMAIN_API}
          - ${DOMAIN_DASHBOARD}
    labels:
      - "traefik.enable=true"

  # ==========================================
  # Authelia (OIDC provider) — auth.trader.derveloy.eu
  # ==========================================
  # The API is an OIDC relying party of this provider (AUTH_MODE=authelia_oidc).
  # Secrets are injected via env vars (Authelia's AUTHELIA_* mapping); the OIDC
  # issuer signing key and the users database are mounted from absolute VPS paths
  # OUTSIDE the repo. See docs/Authentification.md §8 and authelia/configuration.yml.
  authelia:
    image: authelia/authelia:4.39
    container_name: trader-authelia
    restart: unless-stopped
    environment:
      # Core secrets (generate each with: openssl rand -hex 32 — see .env)
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY}
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: ${AUTHELIA_JWT_SECRET}
      AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET: ${AUTHELIA_OIDC_HMAC_SECRET}
      # The OIDC id_token signing key (RS256) has NO env-var mapping. It is loaded from
      # the mounted /secrets/oidc.issuer.key by the `template` config filter, which this
      # variable enables. See authelia/configuration.yml -> identity_providers.oidc.jwks.
      X_AUTHELIA_CONFIG_FILTERS: template
      # Storage = shared project PostgreSQL (service `postgres`), dedicated DB
      # `authelia` (see authelia/configuration.yml). Reuses the project DB creds.
      AUTHELIA_STORAGE_POSTGRES_USERNAME: ${POSTGRES_USER}
      AUTHELIA_STORAGE_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Config + users DB live OUTSIDE the repo on the VPS (never committed).
      - /etc/trader/authelia/configuration.yml:/config/configuration.yml:ro
      - /etc/trader/authelia/users_database.yml:/config/users_database.yml
      - /etc/trader/authelia/oidc.issuer.key:/secrets/oidc.issuer.key:ro
      - authelia_data:/data
    networks:
      - trader-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.authelia.rule=Host(`${DOMAIN_AUTH}`)"
      - "traefik.http.routers.authelia.entrypoints=websecure"
      - "traefik.http.routers.authelia.tls=true"
      - "traefik.http.routers.authelia.tls.certresolver=letsencrypt"
      - "traefik.http.services.authelia.loadbalancer.server.port=9091"

  # ==========================================
  # Trading Bot (Python)
  # ==========================================
  bot:
    cpu_count: 4
    container_name: trader-bot
    image: ghcr.io/${GITHUB_USERNAME}/trader-bot:latest
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 60s
    env_file:
      - .env
    environment:
      ENVIRONMENT: prod
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - bot_logs:/var/log/trader-bot
      - ./db:/db # Mount database migrations folder
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - trader-network
    healthcheck:
      test: [ "CMD", "python", "-m", "main", "status" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ==========================================
  # API (FastAPI)
  # ==========================================
  api:
    container_name: trader-api
    image: ghcr.io/${GITHUB_USERNAME}/trader-api:latest
    pull_policy: always
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENVIRONMENT: prod
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_RELOAD: false # Disable auto-reload in production
      API_WORKERS: 4 # Multiple workers for production
    volumes:
      # Read-only access to per-run bot logs for GET /runs/{id}/logs.
      - bot_logs:/var/log/trader-bot:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - trader-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`${DOMAIN_API}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=8000"

  # ==========================================
  # Dashboard (Vue.js)
  # ==========================================
  dashboard:
    container_name: trader-dashboard
    image: ghcr.io/${GITHUB_USERNAME}/trader-dashboard:latest
    pull_policy: always
    restart: unless-stopped
    networks:
      - trader-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`${DOMAIN_DASHBOARD}`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      # 8080: dashboard nginx runs unprivileged (security review #7).
      - "traefik.http.services.dashboard.loadbalancer.server.port=8080"

  # ==========================================
  # NOTE: Grafana has been moved to external hosting
  # ==========================================
  # Grafana is now hosted on a separate server for multi-project monitoring.
  # PostgreSQL is bound to localhost (127.0.0.1:5432) for security.
  # You will need to:
  # 1. Configure firewall (ufw) to allow ONLY Grafana server IP:
  #    sudo ufw allow from <grafana-ip> to any port 5432
  #    sudo ufw deny 5432
  #    See docs/A6_runbook.md for detailed firewall setup
  # 2. Configure external Grafana to connect to this database using:
  #    Host: <your-server-ip>:5432
  #    Database: ${POSTGRES_DB}
  #    User: ${POSTGRES_USER}
  #    Password: ${POSTGRES_PASSWORD}
  # 3. Import dashboard JSON files from /grafana/dashboards/ into external Grafana
  # 4. Configure datasource in external Grafana (see /grafana/provisioning/datasources/ for reference)

# ==========================================
# PostgreSQL TLS setup (prod only — dev has no TLS)
# ==========================================
# Goal: encrypt the EXTERNAL Grafana <-> Postgres link over the public 5432 port,
# without forcing TLS on local container traffic (the bot does not use it).
#
# 1. Generate a self-signed server certificate on the VPS, in ./db/certificates/:
#      cd db/certificates
#      openssl req -new -x509 -days 825 -nodes -text \
#        -out server.crt -keyout server.key \
#        -subj "/CN=<your-postgres-host-or-ip>"
#    (CN must match the host Grafana connects to if you ever use sslmode=verify-full.)
#
# 2. Lock down the private key so postgres will accept it (mounted read-only):
#      sudo chown root:root server.key && sudo chmod 640 server.key
#    (Or chown to the container postgres user + chmod 600. A group/world-readable
#     key owned by the db user makes postgres refuse to start.)
#
# 3. Bring the stack up; verify TLS is active:
#      docker compose -f docker-compose.prod.yml exec postgres \
#        psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SHOW ssl;"   # -> on
#
# 4. On the external Grafana datasource, set TLS/SSL Mode = require (encrypt only,
#    no cert verification — self-signed). For full verification use verify-ca /
#    verify-full and upload server.crt as the CA root cert in Grafana.
#
# NOTE: ssl=on only ENABLES TLS; it does not require it. Local services keep
# connecting unencrypted. To force TLS for the public connection specifically you
# would add a `hostssl` rule in pg_hba.conf for the external IP range — not done
# here on purpose, per the local-traffic exemption.

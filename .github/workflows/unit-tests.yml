name: Python-Tests

on:
  pull_request:
    branches: "*"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Opt into Node 24 early

jobs:
  python-test:
    name: Python Tests (pytest in container)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get file architecture
        run: cd ~ && pwd && ls -aR

      - uses: actions/cache@v5
        with:
          path: ~/.cache
          key: venv-${{ runner.os }}-${{ hashFiles('**/requirements*.txt') }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          pip-install: -r Bot/requirements-dev.txt

      - name: Run tests
        working-directory: Bot
        run: python -m pytest /home/runner/work/Trader/Trader/tests/ --ignore=/home/runner/work/Trader/Trader/tests/test_instance_lock.py

  api-test:
    name: API Tests (auth/OIDC)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install API dependencies
        run: pip install -r api/requirements.txt pytest

      - name: Run API auth tests
        env:
          ENVIRONMENT: dev
          # config.py requires POSTGRES_PASSWORD in all envs (security review #19);
          # the module-level Settings() runs at import. Tests don't hit a real DB.
          POSTGRES_PASSWORD: test_password
        run: python -m pytest api/tests -q

  secrets-scan:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # pip-audit gates on any known PyPI advisory (no severity tiers there);
      # audits the pinned PROD closures, not the loose requirements.txt
      # (security review #21/CI). Both locks are clean as of this commit.
      - name: Audit Python deps (pip-audit on prod locks)
        run: |
          pip install pip-audit
          pip-audit -r api/requirements.lock
          pip-audit -r bot/requirements.lock

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Prod deps only (--omit=dev): vite/esbuild dev-tooling advisories are not
      # shipped to the nginx image and would otherwise block the pipeline on a
      # breaking vite major. Fails on high+critical in the production bundle.
      - name: Audit dashboard deps (npm audit, prod, high+critical)
        working-directory: dashboard
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
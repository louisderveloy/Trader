# ==========================================
# Production docker-compose
# Uses Docker named volumes instead of local bind mounts
# Start with: docker-compose -f docker-compose.prod.yml up -d
# ==========================================

# ==========================================
# Networks
# ==========================================
networks:
  trader-network:
    driver: bridge

# ==========================================
# Volumes (Docker-managed, persistent)
# ==========================================
volumes:
  postgres_data:
  traefik_certs:
  bot_logs:
  authelia_data: # Authelia filesystem notifier (storage is now PostgreSQL)

services:
  # ==========================================
  # PostgreSQL + TimescaleDB
  # ==========================================
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: trader-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TIMESCALEDB_TELEMETRY: off
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Expose on all interfaces for external Grafana connection
      # SECURITY: Configure firewall (ufw) to allow ONLY Grafana server IP
      # See docs/A6_runbook.md for firewall setup instructions
      - "89.91.163.180:5432:5432" # grafana.derveloy.eu = 89.91.163.180
    networks:
      - trader-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Traefik (Reverse Proxy)
  # ==========================================
  traefik:
    image: traefik:v3.7
    container_name: trader-traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=false" # Disable dashboard in production
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Let's Encrypt configuration
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      # Redirect HTTP to HTTPS
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/letsencrypt
    networks:
      - trader-network
    labels:
      - "traefik.enable=true"

  # ==========================================
  # Authelia (OIDC provider) — auth.trader.derveloy.eu
  # ==========================================
  # The API is an OIDC relying party of this provider (AUTH_MODE=authelia_oidc).
  # Secrets are injected via env vars (Authelia's AUTHELIA_* mapping); the OIDC
  # issuer signing key and the users database are mounted from absolute VPS paths
  # OUTSIDE the repo. See docs/Authentification.md §8 and authelia/configuration.yml.
  authelia:
    image: authelia/authelia:4.39
    container_name: trader-authelia
    restart: unless-stopped
    environment:
      # Core secrets (generate each with: openssl rand -hex 32 — see .env)
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY}
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: ${AUTHELIA_JWT_SECRET}
      AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET: ${AUTHELIA_OIDC_HMAC_SECRET}
      # The OIDC id_token signing key (RS256) has NO env-var mapping. It is loaded from
      # the mounted /secrets/oidc.issuer.key by the `template` config filter, which this
      # variable enables. See authelia/configuration.yml -> identity_providers.oidc.jwks.
      X_AUTHELIA_CONFIG_FILTERS: template
      # Storage = shared project PostgreSQL (service `postgres`), dedicated DB
      # `authelia` (see authelia/configuration.yml). Reuses the project DB creds.
      AUTHELIA_STORAGE_POSTGRES_USERNAME: ${POSTGRES_USER}
      AUTHELIA_STORAGE_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Config + users DB live OUTSIDE the repo on the VPS (never committed).
      - /etc/authelia/configuration.yml:/config/configuration.yml:ro
      - /etc/authelia/users_database.yml:/config/users_database.yml:ro
      - /etc/authelia/oidc.issuer.key:/secrets/oidc.issuer.key:ro
      - authelia_data:/data
    networks:
      - trader-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.authelia.rule=Host(`${DOMAIN_AUTH}`)"
      - "traefik.http.routers.authelia.entrypoints=websecure"
      - "traefik.http.routers.authelia.tls=true"
      - "traefik.http.routers.authelia.tls.certresolver=letsencrypt"
      - "traefik.http.services.authelia.loadbalancer.server.port=9091"

  # ==========================================
  # Trading Bot (Python)
  # ==========================================
  bot:
    cpu_count: 4
    container_name: trader-bot
    image: ghcr.io/${GITHUB_USERNAME}/trader-bot:latest
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 60s
    env_file:
      - .env
    environment:
      ENVIRONMENT: prod
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - bot_logs:/var/log/trader-bot
      - ./db:/db # Mount database migrations folder
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - trader-network
    healthcheck:
      test: [ "CMD", "python", "-m", "main", "status" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ==========================================
  # API (FastAPI)
  # ==========================================
  api:
    container_name: trader-api
    image: ghcr.io/${GITHUB_USERNAME}/trader-api:latest
    pull_policy: always
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENVIRONMENT: prod
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_RELOAD: false # Disable auto-reload in production
      API_WORKERS: 4 # Multiple workers for production
    volumes:
      # Read-only access to per-run bot logs for GET /runs/{id}/logs.
      - bot_logs:/var/log/trader-bot:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - trader-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`${DOMAIN_API}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=8000"

  # ==========================================
  # Dashboard (Vue.js)
  # ==========================================
  dashboard:
    container_name: trader-dashboard
    image: ghcr.io/${GITHUB_USERNAME}/trader-dashboard:latest
    pull_policy: always
    restart: unless-stopped
    networks:
      - trader-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`${DOMAIN_DASHBOARD}`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.services.dashboard.loadbalancer.server.port=80"

  # ==========================================
  # NOTE: Grafana has been moved to external hosting
  # ==========================================
  # Grafana is now hosted on a separate server for multi-project monitoring.
  # PostgreSQL is bound to localhost (127.0.0.1:5432) for security.
  # You will need to:
  # 1. Configure firewall (ufw) to allow ONLY Grafana server IP:
  #    sudo ufw allow from <grafana-ip> to any port 5432
  #    sudo ufw deny 5432
  #    See docs/A6_runbook.md for detailed firewall setup
  # 2. Configure external Grafana to connect to this database using:
  #    Host: <your-server-ip>:5432
  #    Database: ${POSTGRES_DB}
  #    User: ${POSTGRES_USER}
  #    Password: ${POSTGRES_PASSWORD}
  # 3. Import dashboard JSON files from /grafana/dashboards/ into external Grafana
  # 4. Configure datasource in external Grafana (see /grafana/provisioning/datasources/ for reference)

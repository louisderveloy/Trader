# =============================================================================
# Authelia configuration — OIDC provider for the Trader bot (PRODUCTION)
# =============================================================================
# This is a TEMPLATE. On the VPS it lives at /etc/authelia/configuration.yml and
# is mounted read-only into the container (see docker-compose.prod.yml).
#
# Secrets are NOT in this file — they are injected as environment variables using
# Authelia's AUTHELIA_* mapping:
#   AUTHELIA_SESSION_SECRET
#   AUTHELIA_STORAGE_ENCRYPTION_KEY
#   AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET
#   AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET
#   AUTHELIA_IDENTITY_PROVIDERS_OIDC_JWKS_0_KEY_FILE -> /secrets/oidc.issuer.key
#
# The OIDC client_secret below is a HASH of AUTHELIA_OIDC_CLIENT_SECRET (the value
# the API uses). Generate it with:
#   docker run --rm authelia/authelia:4.39 \
#     authelia crypto hash generate pbkdf2 --variant sha512 --password '<secret>'
# Generate the RSA issuer key (used to sign id_tokens, RS256) with:
#   docker run --rm authelia/authelia:4.39 \
#     authelia crypto pair rsa generate --directory /tmp && cat /tmp/private.pem
# =============================================================================

theme: 'light'

server:
  address: 'tcp://0.0.0.0:9091'

log:
  level: 'info'
  format: 'json'

# ------------------------------------------------------------------ users
authentication_backend:
  password_reset:
    disable: true
  file:
    path: '/config/users_database.yml'
    password:
      algorithm: 'argon2'

# ------------------------------------------------------------------ access control
# Authelia here is a pure OIDC provider (no Traefik forward-auth on the app).
# Any user in the database may authenticate (one_factor); the API performs the
# group-based authorization (admins / viewers).
access_control:
  default_policy: 'one_factor'

# ------------------------------------------------------------------ session
session:
  name: 'authelia_session'
  cookies:
    - domain: 'trader.derveloy.eu'
      authelia_url: 'https://auth.trader.derveloy.eu'
      default_redirection_url: 'https://trader.derveloy.eu'
      expiration: '1h'
      inactivity: '5m'

# ------------------------------------------------------------------ storage / notifier
storage:
  local:
    path: '/data/db.sqlite3'
  # encryption_key via AUTHELIA_STORAGE_ENCRYPTION_KEY

notifier:
  # Filesystem notifier (no SMTP needed for a solo deployment). Switch to `smtp`
  # if you want real email for password reset / 2FA enrolment.
  filesystem:
    filename: '/data/notification.txt'

# ------------------------------------------------------------------ OIDC provider
identity_providers:
  oidc:
    # hmac_secret      -> AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET
    # jwks[0].key      -> AUTHELIA_IDENTITY_PROVIDERS_OIDC_JWKS_0_KEY_FILE

    # Claims policy: expose the `groups` claim in the id_token (required since
    # Authelia v4.39 — groups are no longer in the id_token by default).
    claims_policies:
      with_groups:
        id_token:
          - 'groups'

    clients:
      - client_id: 'trader-api'
        client_name: 'Trader API'
        # HASH of AUTHELIA_OIDC_CLIENT_SECRET (see header). Replace before deploy.
        client_secret: '$pbkdf2-sha512$REPLACE_WITH_HASH_OF_AUTHELIA_OIDC_CLIENT_SECRET'
        public: false
        authorization_policy: 'one_factor'
        require_pkce: true
        pkce_challenge_method: 'S256'
        claims_policy: 'with_groups'
        token_endpoint_auth_method: 'client_secret_post'
        redirect_uris:
          - 'https://api.trader.derveloy.eu/auth/oidc/callback'
          - 'https://api.trader.derveloy.eu/auth/oidc/stepup/callback'
        scopes:
          - 'openid'
          - 'profile'
          - 'email'
          - 'groups'
